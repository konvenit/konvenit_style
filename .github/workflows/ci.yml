name: CI

on:
  push:
    branches:
      - master
  # Every pull request, not only those against master: a stacked PR whose base
  # is another feature branch has to be checked as well.
  pull_request:

jobs:
  scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  test:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        rvm:
          - "3.2"
          - "3.3"
          - "3.4"
    name: Ruby ${{ matrix.rvm }} test
    steps:
      - name: Add SSH key
        # this is needed to access private repositories
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_REPO_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo ${{  secrets.PRIVATE_REPO_KNOW_HOST }} >> ~/.ssh/known_hosts

      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.0

      - name: Install dependencies
        run: bundle install

      - name: Run specs
        run: bundle exec rspec

      - name: Run RuboCop
        run: bundle exec rubocop -D -c .rubocop.yml
